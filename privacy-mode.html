<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وضع المناسبة - حماية الخصوصية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: #1e293b; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; border: 1px solid #334155; }
        .status-card { background: #0284c7; border-radius: 16px; padding: 20px; margin: 20px 0; transition: all 0.3s ease; }
        .status-card.active { background: #e11d48; }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
        .status-text { color: #ffffff; font-weight: bold; font-size: 18px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-entry { background: #22c55e; color: white; }
        .btn-exit { background: #ef4444; color: white; }
        .btn:hover { opacity: 0.9; }
        .info-box { background: #0f172a; padding: 12px; border-radius: 10px; font-size: 12px; color: #cbd5e1; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>حالة المناسبة والخصوصية</h1>
    <p>نظام القفل المؤقت للكاميرا عند البوابة</p>
    <div id="statusCard" class="status-card">
        <div id="statusIcon" class="icon">🔓</div>
        <div id="statusText" class="status-text">الكاميرا تعمل بشكل طبيعي</div>
    </div>
    <div class="info-box">عند مسح الـ QR أو شريحة NFC عند الدخول، سيتم تفعيل وضع القفل تلقائياً للحفاظ على الخصوصية.</div>
    <button class="btn btn-entry" onclick="enableEventMode()">محاكاة مسح دخول (قفل الكاميرا)</button>
    <button class="btn btn-exit" onclick="disableEventMode()">محاكاة مسح خروج (فك القفل)</button>
</div>
<script>
    function enableEventMode() {
        document.getElementById('statusCard').classList.add('active');
        document.getElementById('statusIcon').innerText = '🔒';
        document.getElementById('statusText').innerText = 'وضع المناسبة مفعّل (الكاميرا مغلقة)';
    }
    function disableEventMode() {
        document.getElementById('statusCard').classList.remove('active');
        document.getElementById('statusIcon').innerText = '🔓';
        document.getElementById('statusText').innerText = 'تم الخروج (الكاميرا تعمل الآن)';
    }
</script>
</body>
</html>
